name: Deploy CUIT website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'\n      - 'games/**'
      - 'CNAME'
      - '.github/workflows/deploy-cuit-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CUIT source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website
        run: |
          mkdir -p _site/assets _site/games
          cp index.html _site/index.html
          cp index.html _site/404.html
          touch _site/.nojekyll
          cp -R assets/. _site/assets/\n          if [ -d games ]; then cp -R games/. _site/games/; fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
