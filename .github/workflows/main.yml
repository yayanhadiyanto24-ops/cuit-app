
name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.cuit.app",
            "appName": "CUIT",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CUIT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
