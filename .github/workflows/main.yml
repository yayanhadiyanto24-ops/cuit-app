name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'banner.png'
      - 'icon.png'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan struktur folder dan Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          [ -f banner.png ] && cp banner.png www/ || true
          [ -f icon.png ] && cp icon.png www/ || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CUIT" "com.cuit.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: CUIT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
