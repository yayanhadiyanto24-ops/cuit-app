name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'banner.png'
      - 'icon.png'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "CUIT" "com.cuit.app" --web-dir .
          npx cap add android
          mkdir -p resources
          [ -f icon.png ] && cp icon.png resources/icon.png || true
          [ -f icon.png ] && cp icon.png resources/logo.png || true
          npx cap-assets generate --android || true
          npx cap sync android

      - name: Build APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: CUIT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
