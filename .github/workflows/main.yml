name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'banner.png'
      - 'icon.png'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v3

      - name: Siapkan Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependensi & Build APK Android
        run: |
          npm install -g @capacitor/cli
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Simpan APK Hasil Build
        uses: actions/upload-artifact@v3
        with:
          name: cuit-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
