name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'banner.png'
      - 'icon.png'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependensi dan Build APK
        run: |
          npm install -g @capacitor/cli
          npm install || true
          if [ -d "android" ]; then
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Folder android belum ada, lewati build APK."
          fi

      - name: Simpan APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: cuit-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
