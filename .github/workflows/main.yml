name: Buat APK CUIT

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'banner.png'
      - 'icon.png'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode CUIT
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f banner.png ]; then cp banner.png www/; fi
          if [ -f icon.png ]; then cp icon.png www/; fi

      - name: Buat Proyek Capacitor dan Generate Icon
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets

          # Siapkan folder assets untuk ikon
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
          fi

          npx cap init "CUIT" "com.cuit.app" --web-dir www
          npx cap add android

          # Bikin ikon Android otomatis dari icon.png
          if [ -f icon.png ]; then
            npx capacitor-assets generate --android
          fi

          npx cap sync android

      - name: Build APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: CUIT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
