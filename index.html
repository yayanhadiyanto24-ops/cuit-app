<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUIT - Curhat dapat Duit</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* Style Kapsul Sorotan */
    .sorotan-box { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); padding: 12px; border-radius: 10px; margin-bottom: 20px; display: none; }
    .sorotan-title { font-weight: bold; color: #880e4f; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .sorotan-card { background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    
    /* Style Feed Regular */
    .curhat-card { border-bottom: 1px solid #eee; padding: 10px 0; }
    .btn-promosi { background: #6200ee; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 5px; }
    .coins-header { display: flex; justify-content: flex-end; gap: 10px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Koin -->
    <div class="coins-header">
      <span>FREE 🪙 <span id="freeCoins">0</span></span>
      <span>PAID 🟡 <span id="paidCoins">0</span></span>
    </div>

    <!-- Kapsul Sorotan Hari Ini (Hanya muncul jika ada promosi aktif di Supabase) -->
    <div id="sorotanContainer" class="sorotan-box">
      <div class="sorotan-title">🚀 SOROTAN HARI INI</div>
      <div id="sorotanList"></div>
    </div>

    <!-- Feed Curhatan Utama -->
    <h3>Beranda</h3>
    <div id="curhatFeed">Loading postingan...</div>
  </div>

  <script>
    // 1. Inisialisasi Supabase (Ganti URL dan KEY dengan milikmu)
    const SUPABASE_URL = 'https://xyz.supabase.co'; 
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fungsi Memuat Kapsul Sorotan dari Database
    async function loadSorotan() {
      const sorotanContainer = document.getElementById('sorotanContainer');
      const sorotanList = document.getElementById('sorotanList');
      const now = new Date().toISOString();

      // Query data curhat yang is_promoted = true & durasi belum habis
      const { data: promotedPosts, error } = await supabase
        .from('curhat')
        .select('*')
        .eq('is_promoted', true)
        .gt('promoted_until', now)
        .order('created_at', { ascending: false });

      if (error || !promotedPosts || promotedPosts.length === 0) {
        sorotanContainer.style.display = 'none';
        return;
      }

      // Tampilkan Kapsul Sorotan jika data ditemukan
      sorotanContainer.style.display = 'block';
      sorotanList.innerHTML = promotedPosts.map(p => `
        <div class="sorotan-card">
          <strong>${p.username || 'Anonim'}</strong>: ${p.isi || p.content}
        </div>
      `).join('');
    }

    // 3. Fungsi Memuat Feed Curhat Biasa
    async function loadFeed() {
      const feed = document.getElementById('curhatFeed');
      const { data: posts, error } = await supabase
        .from('curhat')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        feed.innerHTML = "Gagal memuat postingan.";
        return;
      }

      feed.innerHTML = posts.map(p => `
        <div class="curhat-card">
          <strong>${p.username || 'Anonim'}</strong>
          <p>${p.isi || p.content}</p>
          <button class="btn-promosi" onclick="promosikan('${p.id}')">🚀 Promosikan</button>
        </div>
      `).join('');
    }

    // 4. Fungsi Tombol Promosikan (Simpan ke Supabase & Potong Koin)
    async function promosikan(curhatId) {
      const hours = prompt("Masukkan durasi promosi (Jam):", "1");
      if (!hours || isNaN(hours)) return;

      const durationHours = parseInt(hours);
      const expiryDate = new Date();
      expiryDate.setHours(expiryDate.getHours() + durationHours);

      // Simpan status promosi ke database Supabase
      const { error } = await supabase
        .from('curhat')
        .update({
          is_promoted: true,
          promoted_until: expiryDate.toISOString()
        })
        .eq('id', curhatId);

      if (error) {
        alert("Gagal mempromosikan: " + error.message);
        return;
      }

      alert("Postingan berhasil dipromosikan ke Sorotan!");
      loadSorotan(); // Refresh tampilan sorotan
      loadFeed();
    }

    // Jalankan pemanggilan data saat halaman dimuat
    window.onload = () => {
      loadSorotan();
      loadFeed();
    };
  </script>
</body>
</html>
