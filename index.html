  <script>
    const CONFIG = {
      FREE_COINS_DAILY: 20,
      MAX_CHAR_FREE_CURHAT: 20,
      MAX_CHAR_FREE_COMMENT: 12,
      COIN_RATE_RP: 5,
      DANA_NUMBER: '085624189461'
    };

    const SUPABASE_URL = 'https://ozakuxlktqweembeqgyh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SeHIgYxNgIKYiZtdg8Wd3w_dicERUWl';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let customDisplayName = localStorage.getItem('cuit_user_name') || null;
    let allPostsCache = [];
    let likesStore = {};
    let promotedPostsStore = JSON.parse(localStorage.getItem('cuit_promoted_posts') || '[]');

    let freeCoins = 20;
    let paidCoins = 120;
    let usedPaidCoins = parseInt(localStorage.getItem('cuit_user_exp')) || 0; // Poin Jam Terbang

    function switchTab(pageId, navElement) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-bar .nav-item').forEach(nav => {
        nav.classList.remove('active');
        const iconBg = nav.querySelector('.nav-icon-bg');
        if (iconBg) nav.innerHTML = nav.innerHTML.replace('<div class="nav-icon-bg">', '').replace('</div>', '');
      });

      document.getElementById(pageId).classList.add('active');
      if (navElement) {
        navElement.classList.add('active');
        if (!navElement.querySelector('.nav-icon-bg')) {
          const iconSpan = navElement.querySelector('.nav-icon');
          if (iconSpan) iconSpan.outerHTML = `<div class="nav-icon-bg">${iconSpan.outerHTML}</div>`;
        }
      }

      if (pageId === 'pageProfile') renderProfileData();
    }

    async function checkUser() {
      const { data } = await supabaseClient.auth.getUser();
      currentUser = data.user;
      loadPosts();
      initRealtime();
    }

    function updateCoinUI() {
      document.getElementById('freeCoinCount').innerText = freeCoins;
      document.getElementById('paidCoinCount').innerText = paidCoins;
      localStorage.setItem('cuit_user_exp', usedPaidCoins);
      if (document.getElementById('pageProfile').classList.contains('active')) {
        renderProfileData();
      }
    }

    function getUserLevel() {
      if (usedPaidCoins >= 1200) return { title: '👑 SULTAN CURHAT', icon: '👑', next: null, target: 1200 };
      if (usedPaidCoins >= 500) return { title: '🔥 ACTIVE CUITER', icon: '🔥', next: '👑 SULTAN CURHAT', target: 1200, prev: 500 };
      if (usedPaidCoins >= 200) return { title: '🤝 SAHABAT', icon: '🤝', next: '🔥 ACTIVE CUITER', target: 500, prev: 200 };
      if (usedPaidCoins >= 50) return { title: '💧 PENDENGAR', icon: '💧', next: '🤝 SAHABAT', target: 200, prev: 50 };
      return { title: '🌱 PEMULA', icon: '🌱', next: '💧 PENDENGAR', target: 50, prev: 0 };
    }

    function openEditProfileModal() {
      const currentName = customDisplayName || (currentUser ? currentUser.email.split('@')[0] : 'yayan.hadiyanto1');
      document.getElementById('editDisplayName').value = currentName;
      document.getElementById('editProfileModal').style.display = 'flex';
    }

    function saveProfileChanges() {
      const newName = document.getElementById('editDisplayName').value.trim();
      if (!newName) return alert('Nama tidak boleh kosong!');
      customDisplayName = newName;
      localStorage.setItem('cuit_user_name', newName);
      document.getElementById('editProfileModal').style.display = 'none';
      renderProfileData();
      loadPosts();
      alert('Profil berhasil diperbarui!');
    }

    function toggleCurhatLimit() {
      const textarea = document.getElementById('postContent');
      const coins = Math.ceil((textarea.value.length || 1) / 1200);
      const type = document.getElementById('curhatCoinType').value;
      const label = type === 'free' ? 'Koin Gratisan' : 'Koin Berbayar';
      document.getElementById('charCount').innerText = `${textarea.value.length} karakter (Biaya: ${coins} ${label})`;
    }

    function updateCharCount(textarea) {
      const coins = Math.ceil(textarea.value.length / 1200) || 1;
      const type = document.getElementById('curhatCoinType').value;
      const label = type === 'free' ? 'Koin Gratisan' : 'Koin Berbayar';
      document.getElementById('charCount').innerText = `${textarea.value.length} karakter (Biaya: ${coins} ${label})`;
    }

    // SUBMIT POSTINGAN KONSISTEN (1 KOIN PER 1.200 KARAKTER BERLAKU SAMA UNTUK GRATIS/PAID)
    async function submitNewPost() {
      const type = document.getElementById('curhatCoinType').value;
      const content = document.getElementById('postContent').value.trim();
      const feeling = document.getElementById('postFeeling').value;

      if (!content) return alert('Isi cerita tidak boleh kosong!');

      const coinsNeeded = Math.ceil(content.length / 1200);

      if (type === 'free') {
        if (freeCoins < coinsNeeded) {
          return alert(`Untuk menerbitkan ${content.length} karakter, kamu membutuhkan ${coinsNeeded} Koin Gratisan. Saldo koin gratisan kamu tidak cukup!`);
        }
        freeCoins -= coinsNeeded;
      } else {
        if (paidCoins < coinsNeeded) {
          return alert(`Untuk menerbitkan ${content.length} karakter, kamu membutuhkan ${coinsNeeded} Koin Berbayar. Saldo koin kamu tidak cukup!`);
        }
        paidCoins -= coinsNeeded;
        usedPaidCoins += coinsNeeded; // Poin Jam Terbang
      }

      updateCoinUI();

      const authorName = customDisplayName || (currentUser ? currentUser.email.split('@')[0] : 'yayan.hadiyanto1');
      const authorEmail = currentUser ? currentUser.email : 'yayan.hadiyanto1@cuit.app';

      const { error } = await supabaseClient.from('curhat').insert([
        { content, user_id: currentUser ? currentUser.id : 'demo_id', user_email: authorEmail, username: authorName, feeling }
      ]);

      if (!error) {
        alert(`Curhatan berhasil diterbitkan! (${content.length} karakter - terpakai ${coinsNeeded} ${type === 'free' ? 'Koin Gratisan' : 'Koin Berbayar'})`);
        document.getElementById('postContent').value = '';
        switchTab('pageHome', document.querySelectorAll('.nav-item')[0]);
      } else {
        alert('Gagal mengirim: ' + error.message);
      }
    }

    // PERBAIKAN LOADPOSTS: PENCOCOKAN ID DENGAN STRING() AGAR CAROUSEL MUNCUL
    async function loadPosts() {
      const container = document.getElementById('postsList');
      const promotedCarousel = document.getElementById('promotedCarousel');
      const promotedSection = document.getElementById('promotedSection');

      const { data, error } = await supabaseClient.from('curhat').select('*').order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-sub); margin-top: 15px;">Belum ada curhatan di beranda.</p>';
        allPostsCache = [];
        return;
      }

      allPostsCache = data;

      // Filter promosi aktif
      const activePromotions = promotedPostsStore.filter(p => p.promotedUntil > Date.now());
      localStorage.setItem('cuit_promoted_posts', JSON.stringify(activePromotions));

      // Render Carousel Promosi Ramping
      if (activePromotions.length > 0) {
        let cardsHTML = '';
        
        activePromotions.forEach(item => {
          // Pencocokan ID fleksibel (String)
          const post = allPostsCache.find(p => String(p.id) === String(item.id));
          if (post) {
            let rawName = post.username || (post.user_email ? post.user_email.split('@')[0] : 'Pengguna');
            let snippet = post.content.length > 35 ? post.content.substring(0, 35) + '...' : post.content;
            
            cardsHTML += `
              <div onclick="openPromotedDetail('${post.id}')" style="min-width: 140px; max-width: 150px; background: linear-gradient(135deg, #ffffff, #fff8f0); border: 1.5px solid #f39c12; border-radius: 14px; padding: 10px; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 6px rgba(230,126,34,0.12);">
                <div style="font-size: 10px; font-weight: 800; color: #e67e22; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">📌 ${rawName}</div>
                <div style="font-size: 11px; color: #2c2e43; line-height: 1.3; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${snippet}</div>
                <div style="font-size: 9px; color: #d35400; font-weight: 700; margin-top: 6px; text-align: right;">Ketuk & Baca →</div>
              </div>
            `;
          }
        });

        if (cardsHTML !== '') {
          promotedSection.style.display = 'block';
          promotedCarousel.innerHTML = cardsHTML;
        } else {
          promotedSection.style.display = 'none';
        }
      } else {
        promotedSection.style.display = 'none';
      }

      container.innerHTML = data.map(p => renderCardHTML(p)).join('');
    }

    function openPromotedDetail(postId) {
      const post = allPostsCache.find(p => String(p.id) === String(postId));
      if (!post) return;

      const modalContent = document.getElementById('promotedDetailContent');
      modalContent.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:11px; font-weight:800; color:#e67e22;">🚀 POSTINGAN SOROTAN</span>
          <button onclick="document.getElementById('promotedDetailModal').style.display='none'" style="border:none; background:none; font-size:16px; cursor:pointer;">✕</button>
        </div>
        ${renderCardHTML(post)}
      `;
      
      document.getElementById('promotedDetailModal').style.display = 'flex';
    }

    function promotePost(postId) {
      const hours = parseInt(prompt("Berapa jam ingin mempromosikan postingan ini? (1 Koin Berbayar = 1 Jam):", "1")) || 0;
      if (hours <= 0) return;

      if (paidCoins < hours) {
        return alert(`Saldo koin kamu tidak cukup! Mempromosikan selama ${hours} jam membutuhkan ${hours} Koin Berbayar.`);
      }

      paidCoins -= hours;
      usedPaidCoins += hours; // Poin Jam Terbang
      updateCoinUI();

      const promotedUntil = Date.now() + (hours * 3600 * 1000);
      
      // Simpan ID sebagai String
      promotedPostsStore = promotedPostsStore.filter(p => String(p.id) !== String(postId));
      promotedPostsStore.unshift({ id: String(postId), promotedUntil });
      
      localStorage.setItem('cuit_promoted_posts', JSON.stringify(promotedPostsStore));

      alert(`Postingan berhasil dipromosikan ke barisan Sorotan selama ${hours} jam! (+${hours} Poin Jam Terbang)`);
      loadPosts();
    }

    function renderCardHTML(p) {
      let rawName = p.username || (p.user_email ? p.user_email.split('@')[0] : 'Pengguna CUIT');
      let feelingTag = p.feeling || 'Bahagia';
      const cleanTag = feelingTag.replace(/[^a-zA-Z]/g, '');
      const handle = p.user_email ? `@${p.user_email.split('@')[0]}` : '@yayan.hadiyanto1';
      const likesCount = likesStore[p.id] || 0;
      const userLvl = getUserLevel();

      return `
        <div class="post-card">
          <div class="post-header">
            <div class="user-info">
              <div class="avatar-container">
                <div class="avatar-circle">🤍</div>
                <div class="level-badge-icon">${userLvl.icon}</div>
              </div>
              <div class="user-details">
                <div class="user-name-row">
                  <span class="user-name">${rawName}</span>
                  <span class="user-handle">${handle}</span>
                </div>
                <div class="badge-row">
                  <span class="btn-sm-badge badge-pemula">${userLvl.title}</span>
                  <span class="btn-sm-badge tag-${cleanTag}">${feelingTag}</span>
                </div>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
              <button class="btn-secondary" style="padding: 3px 6px; border-radius: 6px; font-size:10px;" onclick="alert('Laporan dikirim!')">🚩</button>
              <span class="post-time">${new Date(p.created_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})} WIB</span>
            </div>
          </div>
          <div class="post-body">${p.content}</div>
          <span class="btn-sm-badge badge-publik">🌐 Publik</span>
          <div class="post-footer-actions">
            <div class="action-chip" onclick="toggleLike('${p.id}')">♡ Suka (${likesCount})</div>
            <div class="action-chip" onclick="addComment('${p.id}')">💬 Komentar (0)</div>
            <div class="action-chip" onclick="openGiftModal('${p.id}')">🎁 Gift (0)</div>
            <div class="action-chip" style="background: #fff3e0; color: #e67e22;" onclick="promotePost('${p.id}')">🚀 Promosikan</div>
          </div>
        </div>
      `;
    }

    function initRealtime() {
      supabaseClient.channel('realtime_curhat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'curhat' }, () => {
          loadPosts();
        }).subscribe();
    }

    function toggleLike(postId) {
      if (freeCoins >= 1) {
        freeCoins -= 1;
      } else if (paidCoins >= 1) {
        paidCoins -= 1;
        usedPaidCoins += 1;
      } else {
        return alert('Saldo Koin Gratisan dan Koin Berbayar kamu habis!');
      }

      updateCoinUI();
      likesStore[postId] = (likesStore[postId] || 0) + 1;
      loadPosts();
    }

    function addComment(postId) {
      const comm = prompt("Tulis komentar Anda (1 Koin per 1.200 Karakter):");
      if (!comm) return;

      const coinsNeeded = Math.ceil(comm.length / 1200);

      if (freeCoins >= coinsNeeded) {
        freeCoins -= coinsNeeded;
      } else if (paidCoins >= coinsNeeded) {
        paidCoins -= coinsNeeded;
        usedPaidCoins += coinsNeeded;
      } else {
        return alert(`Komentar membutuhkan ${coinsNeeded} Koin. Saldo koin kamu tidak cukup!`);
      }

      updateCoinUI();
      alert('Komentar berhasil dikirim!');
    }

    function openGiftModal(postId) {
      document.getElementById('giftModal').style.display = 'flex';
    }

    function sendGiftAction(cost, giftName) {
      if (paidCoins < cost) return alert('Saldo Koin Berbayar tidak mencukupi!');
      paidCoins -= cost;
      usedPaidCoins += cost;
      updateCoinUI();
      document.getElementById('giftModal').style.display = 'none';
      alert(`Berhasil mengirimkan Gift ${giftName} (${cost} Koin Berbayar)! +${cost} Poin Jam Terbang.`);
      loadPosts();
    }

    function filterByTag(tagName) {
      document.getElementById('searchInput').value = tagName;
      switchTab('pageSearch', document.querySelectorAll('.nav-item')[1]);
      document.getElementById('feelingFilter').value = tagName;
      searchPosts();
    }

    function filterPosts(type, btn) {
      document.querySelectorAll('.pills-group .pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadPosts();
    }

    function searchPosts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const feeling = document.getElementById('feelingFilter').value;
      const container = document.getElementById('searchResults');

      let filtered = allPostsCache.filter(p => {
        const matchesQuery = !query || (p.content && p.content.toLowerCase().includes(query)) || (p.username && p.username.toLowerCase().includes(query));
        const matchesFeeling = !feeling || (p.feeling && p.feeling.includes(feeling));
        return matchesQuery && matchesFeeling;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-sub); margin-top: 10px;">Tidak ditemukan curhatan yang sesuai.</p>';
      } else {
        container.innerHTML = filtered.map(p => renderCardHTML(p)).join('');
      }
    }

    function startLiveTeks() {
      const userLvl = getUserLevel();
      if (userLvl.title === '🌱 PEMULA') return alert('Syarat membuat Live Teks minimal level 💧 PENDENGAR!');
      if (paidCoins < 10) return alert('Minimal saldo 10 Koin Berbayar untuk siaran Live Teks!');
      
      document.getElementById('liveStatusBox').innerHTML = '<b>🔴 LIVE TEKS AKTIF</b><br>Sesi live teks sedang berjalan secara real-time.';
      alert('Live Teks berhasil dimulai!');
    }

    function openWalletModal() {
      document.getElementById('wPaidCoin').innerText = paidCoins;
      document.getElementById('wPaidValue').innerText = (paidCoins * CONFIG.COIN_RATE_RP).toLocaleString('id-ID');
      document.getElementById('walletModal').style.display = 'flex';
    }

    function buyPackageDANA(price, coins) {
      const note = encodeURIComponent(`Topup CUIT ${coins} Koin`);
      const danaUrl = `https://link.dana.id/transfer?phone=${CONFIG.DANA_NUMBER}&amount=${price}&notes=${note}`;
      
      window.open(danaUrl, '_blank');

      setTimeout(() => {
        if (confirm(`Anda diarahkan untuk membayar Rp ${price.toLocaleString('id-ID')} ke e-Wallet DANA (${CONFIG.DANA_NUMBER}).\n\nKlik "OK" jika Anda sudah menyelesaikan transfer untuk menambahkan ${coins} Koin Berbayar secara otomatis.`)) {
          paidCoins += coins;
          usedPaidCoins += Math.floor(coins / 10);
          updateCoinUI();
          openWalletModal();
          alert(`Top-Up Berhasil! +${coins} Koin Berbayar telah ditambahkan ke dompet kamu.`);
        }
      }, 800);
    }

    function openCashoutModal() {
      calcCashoutFee();
      document.getElementById('cashoutModal').style.display = 'flex';
    }

    function calcCashoutFee() {
      const type = document.getElementById('cashoutType').value;
      const coins = parseInt(document.getElementById('cashoutCoins').value) || 0;
      const gross = coins * CONFIG.COIN_RATE_RP;
      const fee = type === 'bank' ? 3000 : 500;
      const net = Math.max(0, gross - fee);

      document.getElementById('coGross').innerText = gross.toLocaleString('id-ID');
      document.getElementById('coFee').innerText = fee.toLocaleString('id-ID');
      document.getElementById('coNet').innerText = net.toLocaleString('id-ID');
    }

    async function submitCashout() {
      const type = document.getElementById('cashoutType').value;
      const coins = parseInt(document.getElementById('cashoutCoins').value) || 0;
      const accountName = document.getElementById('cashoutAccountName').value.trim();
      const account = document.getElementById('cashoutAccount').value.trim();

      if (coins < 200) return alert('Minimum penarikan adalah 200 Koin Berbayar (Rp 1.000)!');
      if (coins > paidCoins) return alert('Saldo Koin Berbayar Anda tidak cukup!');
      
      if (!accountName) return alert('Nama pemilik akun DANA / Bank wajib diisi!');
      if (!account) return alert('Nomor tujuan DANA / Bank wajib diisi!');

      const gross = coins * CONFIG.COIN_RATE_RP;
      const fee = type === 'bank' ? 3000 : 500;
      const netAmount = Math.max(0, gross - fee);

      try {
        const { error } = await supabaseClient.from('payouts').insert([
          {
            user_id: currentUser ? currentUser.id : 'demo_id',
            user_email: currentUser ? currentUser.email : 'guest@cuit.app',
            payout_type: type,
            account_name: accountName,
            account_number: account,
            coins_deducted: coins,
            net_amount: netAmount,
            status: 'pending'
          }
        ]);

        if (error) {
          console.warn("Tabel Supabase belum dipasang, memproses secara lokal:", error.message);
        }

        paidCoins -= coins;
        updateCoinUI();
        document.getElementById('cashoutModal').style.display = 'none';

        document.getElementById('cashoutAccountName').value = '';
        document.getElementById('cashoutAccount').value = '';

        alert(`Pengajuan penarikan dana ke ${type.toUpperCase()} (${accountName} - ${account}) berhasil dikirim! Saldo bersih Rp ${netAmount.toLocaleString('id-ID')} akan diproses.`);
      } catch (err) {
        alert('Terjadi kesalahan proses penarikan: ' + err.message);
      }
    }

    function openModerationPanel() {
      const userLvl = getUserLevel();
      if (userLvl.title === '🌱 PEMULA' || userLvl.title === '💧 PENDENGAR' || userLvl.title === '🤝 SAHABAT') {
        return alert('Akses Panel Moderasi hanya terbuka untuk Level 🔥 ACTIVE CUITER dan 👑 SULTAN CURHAT!');
      }
      alert('Panel Moderasi Aktif: Anda memiliki hak akses meninjau laporan curhatan!');
    }

    function openCommunityModal() {
      const userLvl = getUserLevel();
      if (userLvl.title === '🌱 PEMULA' || userLvl.title === '💧 PENDENGAR') {
        return alert('Fitur membuat Komunitas terbuka mulai dari Level 🤝 SAHABAT!');
      }
      alert('Selamat! Anda dapat membuat Komunitas CUIT baru.');
    }

    function openConfigModal() {
      document.getElementById('configModal').style.display = 'flex';
    }

    function renderProfileData() {
      const userLvl = getUserLevel();
      const displayName = customDisplayName || (currentUser ? currentUser.email.split('@')[0] : 'yayan.hadiyanto1');
      const handleName = currentUser ? `@${currentUser.email.split('@')[0]}` : '@yayan.hadiyanto1';

      document.getElementById('profName').innerText = displayName;
      document.getElementById('profHandle').innerText = handleName;
      document.getElementById('profBadgeIcon').innerText = userLvl.icon;
      document.getElementById('profLevelTitle').innerText = userLvl.title;
      document.getElementById('profExp').innerText = `${usedPaidCoins} Poin`;

      const progressBar = document.getElementById('levelProgressBar');
      const nextInfo = document.getElementById('levelNextInfo');

      if (!userLvl.next) {
        progressBar.style.width = '100%';
        nextInfo.innerText = 'Level Maksimal!';
      } else {
        const range = userLvl.target - userLvl.prev;
        const currentProgress = usedPaidCoins - userLvl.prev;
        const percentage = Math.min(100, Math.max(0, (currentProgress / range) * 100));
        const needed = userLvl.target - usedPaidCoins;

        progressBar.style.width = `${percentage}%`;
        nextInfo.innerText = `${needed} Poin Jam Terbang lagi menuju ${userLvl.next}`;
      }

      if (currentUser) {
        document.getElementById('authBtnLogout').innerText = 'Keluar Akun';
      } else {
        document.getElementById('authBtnLogout').innerText = 'Masuk / Daftar';
      }
    }

    function handleAuthAction() {
      if (currentUser) {
        supabaseClient.auth.signOut().then(() => location.reload());
      } else {
        document.getElementById('authModal').style.display = 'flex';
      }
    }

    async function submitLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (!error) {
        document.getElementById('authModal').style.display = 'none';
        checkUser();
      } else alert('Gagal masuk: ' + error.message);
    }

    async function submitSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (!error) alert('Pendaftaran berhasil! Silakan masuk.');
      else alert('Error: ' + error.message);
    }

    checkUser();
  </script>
