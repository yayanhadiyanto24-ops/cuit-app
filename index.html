<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUIT - Curhat Dapat Duit</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0056b3;
      --primary-light: #e6f0fa;
      --accent: #ffc107;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
      --text-sub: #666666;
      --border: #e0e0e0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* Header & Banner */
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; }
    .logo-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .coin-badge { display: flex; gap: 8px; font-size: 0.85rem; font-weight: bold; }
    .badge-item { background: var(--primary-light); padding: 4px 8px; border-radius: 20px; color: var(--primary); display: flex; align-items: center; gap: 4px; }
    .banner-container { width: 100%; max-height: 150px; overflow: hidden; }
    .banner-container img { width: 100%; height: auto; object-fit: cover; display: block; }

    /* Main Container */
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards & Post */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-name { font-weight: bold; font-size: 0.95rem; }
    .member-level { font-size: 0.7rem; background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .post-feeling { font-size: 0.8rem; background: #eee; padding: 2px 8px; border-radius: 10px; color: #555; }
    .post-content { font-size: 0.95rem; line-height: 1.4; margin-bottom: 12px; white-space: pre-line; }
    .post-actions { display: flex; gap: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .btn-action { background: none; border: none; font-size: 0.85rem; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* Form Elements */
    textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; resize: none; margin-bottom: 10px; }
    select, input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 5px; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; border-top: 1px solid var(--border); padding: 8px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--text-sub); cursor: pointer; text-decoration: none; }
    .nav-item.active { color: var(--primary); font-weight: bold; }

    /* Gift Grid */
    .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
    .gift-item { border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; font-size: 0.8rem; }
    .gift-item.selected { border-color: var(--primary); background: var(--primary-light); }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="logo-title">CUIT</div>
      <div class="coin-badge">
        <div class="badge-item">FREE <span id="valFreeCoin">0</span></div>
        <div class="badge-item">🪙 <span id="valPaidCoin">0</span></div>
      </div>
    </div>
    <div class="banner-container">
      <img src="banner.png" alt="CUIT Banner" onerror="this.style.display='none'">
    </div>
  </header>

  <div class="container">
    <!-- TAB BERANDA -->
    <div id="pageHome" class="tab-content active">
      <div id="postsList">
        <p style="text-align: center; color: var(--text-sub); margin-top: 15px;">Memuat curhatan...</p>
      </div>
    </div>

    <!-- TAB BUAT CURHAT -->
    <div id="pageCreate" class="tab-content">
      <div class="card">
        <h3>Buat Curhatan Baru</h3>
        <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 10px;">
          Curhat koin gratisan maks. 20 karakter. Koin berbayar maks. 1.200 karakter.
        </p>
        
        <label style="font-size:0.85rem;">Pilih Perasaan:</label>
        <select id="feelingSelect">
          <option value="Bersyukur">🤲 Bersyukur</option>
          <option value="Bahagia">😊 Bahagia</option>
          <option value="Semangat">🔥 Semangat</option>
          <option value="Cinta">💖 Cinta</option>
          <option value="Sedih">😢 Sedih</option>
          <option value="Marah">😡 Marah</option>
          <option value="Kecewa">💔 Kecewa</option>
          <option value="Cemas">😨 Cemas</option>
          <option value="Lelah">😫 Lelah</option>
          <option value="Bingung">🤔 Bingung</option>
          <option value="Terharu">🥺 Terharu</option>
          <option value="Iri">😒 Iri</option>
          <option value="Takut">😱 Takut</option>
          <option value="Kangen">💌 Kangen</option>
          <option value="Lega">😌 Lega</option>
          <option value="Bangga">🦁 Bangga</option>
        </select>

        <textarea id="postContent" placeholder="Tuliskan curhatanmu di sini..."></textarea>
        
        <button class="btn btn-primary" onclick="publishCurhat('free')">Terbitkan (Pakai Koin Gratisan / Berbayar)</button>
        <button class="btn btn-outline" onclick="publishCurhat('paid')">Terbitkan via Koin Berbayar Khusus</button>
      </div>
    </div>

    <!-- TAB LIVE TEKS -->
    <div id="pageLive" class="tab-content">
      <div class="card">
